<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的网站名称</title>
    <style>
        /* 基本样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* 导航条样式 */
        nav {
            background-color: #333;
            padding: 1rem;
            text-align: center;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
        }
        
        /* 主内容区域样式 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* 标题样式 */
        h1, h2 {
            color: #333;
            margin-bottom: 1rem;
        }
        
        /* 段落样式 */
        p {
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        
        /* 表单样式 */
        form {
            background-color: #f5f5f5;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        input, textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        button {
            background-color: #333;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">主页</a>
        <a href="#about">关于我</a>
        <a href="#services">服务</a>
        <a href="#contact">联系</a>
    </nav>

    <div class="container">
        <h1>欢迎来到我的网站</h1>
        
        <section id="home">
            <h2>首页</h2>
            <p>这是一个简单的个人网站，展示了我的信息和一些服务内容。</p>
        </section>

        <section id="about">
            <h2>关于我</h2>
            <p>我是你的名字。我在什么地方工作？学习什么专业？有什么兴趣爱好？</p>
        </section>

        <section id="services">
            <h2>服务</h2>
            <form action="/submit" method="post">
                <input type="text" placeholder="请输入内容..." name="content">
                <button type="submit">提交</button>
            </form>
        </section>

        <section id="contact">
            <h2>联系</h2>
            <p>你可以通过以下方式联系我：</p>
            <ul>
                <li>Email: 你的邮箱地址</li>
                <li>电话: 你的联系电话</li>
                <li>社交媒体链接：添加你的社交平台链接，如<a href="#">微博</a>、<a href="#">微信</a>等。</li>
            </ul>
        </section>
    </div>
</body>
</html>
